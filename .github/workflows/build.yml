name: Build Geode Mod

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            platform: win
          - name: macOS
            os: macos-15
            platform: mac
          - name: iOS
            os: macos-15
            platform: ios
          - name: Android32
            os: ubuntu-latest
            platform: android32
          - name: Android64
            os: ubuntu-latest
            platform: android64

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Geode mod
        uses: geode-sdk/build-geode-mod@main
        with:
          platform: ${{ matrix.platform }}
          sdk: v5.11.2

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: build/*.geode
